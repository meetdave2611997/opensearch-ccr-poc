# CI-only cluster pair for the CCR DR pipeline.
#
# Differs from ../docker-compose.yml (local dev) on purpose:
#   - no container_name and no published host ports, so each team gets its own
#     isolated pair on one agent (compose project: -p ccr-<team>)
#   - no Dashboards
#   - a "runner" service (profile: tools) on the same network that runs the scripts
#
# Usage (see ci/pipeline.sh):
#   docker compose -p ccr-rit -f ci/docker-compose.ci.yml up -d --wait opensearch-primary opensearch-secondary
#   docker compose -p ccr-rit -f ci/docker-compose.ci.yml run --rm runner dr-switchover.py ...

x-opensearch: &opensearch
  image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-2.13.0}
  ulimits:
    memlock:
      soft: -1
      hard: -1
    nofile:
      soft: 65536
      hard: 65536
  networks:
    - opensearch-net
  healthcheck:
    test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
    interval: 10s
    timeout: 10s
    retries: 30
    start_period: 30s

services:
  opensearch-primary:
    <<: *opensearch
    environment:
      - cluster.name=primary-cluster
      - node.name=opensearch-primary
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms${OS_HEAP:-1g} -Xmx${OS_HEAP:-1g}"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    volumes:
      - primary-data:/usr/share/opensearch/data

  opensearch-secondary:
    <<: *opensearch
    environment:
      - cluster.name=secondary-cluster
      - node.name=opensearch-secondary
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms${OS_HEAP:-1g} -Xmx${OS_HEAP:-1g}"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    volumes:
      - secondary-data:/usr/share/opensearch/data

  runner:
    image: ${RUNNER_IMAGE:-ccr-runner:local}
    profiles: ["tools"]
    networks:
      - opensearch-net
    environment:
      - OPENSEARCH_INDICES_FILE
      - OPENSEARCH_RETRY_MAX
      - OPENSEARCH_RETRY_DELAY

volumes:
  primary-data:
  secondary-data:

networks:
  opensearch-net:
    driver: bridge
